<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Thu Chi 2026 - Đa Kỳ Hạn</title>
    <style>
        :root { --primary: #2563eb; --success: #059669; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .container { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h2 { text-align: center; color: var(--primary); font-size: 22px; margin-bottom: 24px; font-weight: 800; }
        .section { margin-bottom: 20px; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .section-revenue { background-color: #eff6ff; border-color: #bfdbfe; }
        .section-cost { background-color: #fff7ed; border-color: #ffedd5; }
        .section-title { font-weight: 700; font-size: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
        input { flex: 1; }
        .btn-del { background: #fff; color: var(--danger); border: 1px solid #fecaca; border-radius: 8px; width: 40px; cursor: pointer; font-size: 18px; }
        .btn-add { background: white; color: var(--primary); border: 1px solid var(--primary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-calc { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin: 10px 0; }
        .result-box { padding: 20px; background: #0f172a; color: white; border-radius: 16px; display: none; margin-bottom: 24px; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .final-amount { font-size: 20px; border-top: 1px solid #334155; padding-top: 12px; margin-top: 8px; font-weight: 700; color: #4ade80; }
        .alert-box { font-size: 12px; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: none; line-height: 1.4; }
        .alert-warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
        .alert-info { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sổ Thu Chi 2026</h2>

    <!-- NHẬP DOANH THU -->
    <div class="section section-revenue">
        <div class="section-title" style="color: #1e40af;">
            <span>💰 DOANH THU</span>
            <button class="btn-add" onclick="addField('rev-list')">+ THÊM</button>
        </div>
        <div id="rev-list">
            <div class="input-group">
                <input type="number" class="rev-in" placeholder="Số tiền đơn">
                <button class="btn-del" onclick="this.parentElement.remove()">×</button>
            </div>
        </div>
    </div>

    <!-- NHẬP CHI PHÍ -->
    <div class="section section-cost">
        <div class="section-title" style="color: #9a3412;">
            <span>💸 CHI PHÍ</span>
            <button class="btn-add" onclick="addField('cost-list')">+ THÊM</button>
        </div>
        <div id="cost-list">
            <div class="input-group">
                <input type="number" class="cost-in" placeholder="Số tiền chi">
                <button class="btn-del" onclick="this.parentElement.remove()">×</button>
            </div>
        </div>
    </div>

    <!-- CÀI ĐẶT KỲ HẠN VÀ THUẾ -->
    <div style="padding: 0 8px 15px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; font-weight: 600;">Kỳ nộp thuế:</span>
            <select id="taxPeriod" style="padding: 8px; border-radius: 8px;">
                <option value="year">Theo Năm (Hộ khoán)</option>
                <option value="quarter" selected>Theo Quý (Hộ kê khai)</option>
                <option value="month">Theo Tháng (>50 tỷ/năm)</option>
            </select>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 14px; font-weight: 600;">Thuế suất (%):</span>
            <input type="number" id="taxRate" value="1.5" style="width: 70px; padding: 8px; flex: none;">
        </div>
    </div>

    <div id="msgBox" class="alert-box"></div>

    <button class="btn-calc" onclick="calculateAll()">TÍNH & LƯU KẾT QUẢ</button>

    <div id="resultArea" class="result-box">
        <div class="res-row"><span>Tổng doanh thu:</span> <span id="outRev">0</span></div>
        <div class="res-row"><span>Tổng chi phí:</span> <span id="outCost">0</span></div>
        <div class="res-row"><span>Tiền thuế:</span> <span id="outTax" style="color: #fb7185;">0</span></div>
        <div class="res-row final-amount"><span>THỰC CẦM:</span> <span id="outFinal">0</span></div>
    </div>

    <div id="historyDisplay" style="margin-top: 20px;"></div>
</div>

<script>
    function addField(id) {
        const div = document.createElement('div');
        div.className = 'input-group';
        const cls = id === 'rev-list' ? 'rev-in' : 'cost-in';
        div.innerHTML = `<input type="number" class="${cls}" placeholder="0"><button class="btn-del" onclick="this.parentElement.remove()">×</button>`;
        document.getElementById(id).appendChild(div);
    }

    function calculateAll() {
        let r = 0; document.querySelectorAll('.rev-in').forEach(i => r += Number(i.value));
        let c = 0; document.querySelectorAll('.cost-in').forEach(i => c += Number(i.value));
        let period = document.getElementById("taxPeriod").value;
        let msg = document.getElementById("msgBox");
        
        let tax = 0;
        msg.style.display = "none";

        // Logic 1 tỷ miễn thuế (2026)
        if (r <= 1000000000) {
            tax = 0;
            if(r > 0) {
                msg.innerHTML = "✓ Chúc mừng! Doanh thu dưới 1 tỷ được miễn thuế GTGT & TNCN.";
                msg.className = "alert-box alert-info";
                msg.style.display = "block";
            }
        } else {
            let rate = Number(document.getElementById("taxRate").value);
            tax = r * (rate / 100);
        }

        // Cảnh báo 50 tỷ nộp theo tháng
        if (r > 50000000000 && period !== 'month') {
            msg.innerHTML = "⚠️ Cảnh báo: Doanh thu > 50 tỷ/năm bắt buộc phải kê khai theo THÁNG.";
            msg.className = "alert-box alert-warning";
            msg.style.display = "block";
        }

        let final = r - c - tax;
        const fmt = (n) => n.toLocaleString('vi-VN') + " đ";

        document.getElementById("resultArea").style.display = "block";
        document.getElementById("outRev").innerText = fmt(r);
        document.getElementById("outCost").innerText = fmt(c);
        document.getElementById("outTax").innerText = "-" + fmt(tax);
        document.getElementById("outFinal").innerText = (final >= 0 ? "+" : "") + fmt(final);
    }
</script>
</body>
</html>
