<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Thu Chi Chuyên Nghiệp</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #1a73e8; text-align: center; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 10px; }
        .section-title { font-weight: bold; margin-bottom: 10px; color: #444; display: flex; justify-content: space-between; align-items: center; }
        .input-group { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .btn-del { background: none; color: #dc3545; border: none; font-weight: bold; cursor: pointer; padding: 5px 10px; font-size: 18px; }
        .btn-add { background: #e8f0fe; color: #1a73e8; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-calc { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin: 10px 0; }
        .result-box { padding: 15px; background: #343a40; color: white; border-radius: 8px; display: none; margin-bottom: 20px; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .final-amount { font-size: 1.3em; color: #4ade80; border-top: 1px solid #555; padding-top: 10px; margin-top: 5px; }
        .history-section { border-top: 2px solid #eee; padding-top: 15px; }
        .history-item { font-size: 13px; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .history-amount { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Quản Lý Thu Chi</h2>

    <div class="section">
        <div class="section-title"><span>DOANH THU</span><button class="btn-add" onclick="addField('rev-list')">+ Thêm đơn</button></div>
        <div id="rev-list"><div class="input-group"><input type="number" class="rev-in" placeholder="Số tiền đơn"><button class="btn-del" onclick="this.parentElement.remove()">×</button></div></div>
    </div>

    <div class="section">
        <div class="section-title"><span>CHI PHÍ</span><button class="btn-add" onclick="addField('cost-list')">+ Thêm chi phí</button></div>
        <div id="cost-list"><div class="input-group"><input type="number" class="cost-in" placeholder="Số tiền chi"><button class="btn-del" onclick="this.parentElement.remove()">×</button></div></div>
    </div>

    <div style="padding: 0 15px; margin-bottom: 10px;">
        <label style="font-size: 13px; font-weight: bold;">Thuế (%)</label>
        <input type="number" id="taxRate" value="1.5" style="width: 50px; margin-left: 10px;">
    </div>

    <button class="btn-calc" onclick="calculateAll()">TÍNH & LƯU LỊCH SỬ</button>

    <div id="resultArea" class="result-box">
        <div class="res-row"><span>Tổng doanh thu:</span> <span id="outRev">0</span></div>
        <div class="res-row"><span>Tổng chi phí:</span> <span id="outCost">0</span></div>
        <div class="res-row"><span>Tiền thuế:</span> <span id="outTax" style="color: #ff8787;">0</span></div>
        <div class="res-row final-amount"><span>THỰC CẦM:</span> <span id="outFinal">0</span></div>
    </div>

    <div class="history-section">
        <h4 style="margin: 0 0 10px 0;">Lịch sử hôm nay</h4>
        <div id="historyDisplay"></div>
        <button onclick="clearHistory()" style="background:none; border:none; color:#dc3545; font-size:11px; cursor:pointer; margin-top:10px;">Xóa lịch sử</button>
    </div>
</div>

<script>
    window.onload = showHistory;

    function addField(id) {
        const div = document.createElement('div');
        div.className = 'input-group';
        const cls = id === 'rev-list' ? 'rev-in' : 'cost-in';
        div.innerHTML = `<input type="number" class="${cls}" placeholder="Số tiền"><button class="btn-del" onclick="this.parentElement.remove()">×</button>`;
        document.getElementById(id).appendChild(div);
    }

    function calculateAll() {
        let r = 0; document.querySelectorAll('.rev-in').forEach(i => r += Number(i.value));
        let c = 0; document.querySelectorAll('.cost-in').forEach(i => c += Number(i.value));
        let rate = Number(document.getElementById("taxRate").value);
        let tax = r * (rate / 100);
        let final = r - c - tax;

        const fmt = (n) => n.toLocaleString('vi-VN') + " đ";
        document.getElementById("resultArea").style.display = "block";
        document.getElementById("outRev").innerText = fmt(r);
        document.getElementById("outCost").innerText = fmt(c);
        document.getElementById("outTax").innerText = "-" + fmt(tax);
        document.getElementById("outFinal").innerText = fmt(final);

        saveHistory(final);
    }

    function saveHistory(amt) {
        let history = JSON.parse(localStorage.getItem("proHistory") || "[]");
        let now = new Date();
        let time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        history.unshift({ time: time, amount: amt });
        if(history.length > 5) history.pop();
        localStorage.setItem("proHistory", JSON.stringify(history));
        showHistory();
    }

    function showHistory() {
        let history = JSON.parse(localStorage.getItem("proHistory") || "[]");
        document.getElementById("historyDisplay").innerHTML = history.map(h => `
            <div class="history-item">
                <span>${h.time}</span>
                <span class="history-amount">+${h.amount.toLocaleString('vi-VN')} đ</span>
            </div>
        `).join('') || "<p style='font-size:12px; color:#999;'>Chưa có dữ liệu</p>";
    }

    function clearHistory() {
        if(confirm("Xóa lịch sử?")) {
            localStorage.removeItem("proHistory");
            showHistory();
        }
    }
</script>

</body>
</html>
