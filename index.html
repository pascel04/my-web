<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Thu Chi - Fix Lỗi Hiển Thị</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; }
        .section { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; border-radius: 10px; background-color: #fafafa; }
        .section-title { font-weight: bold; margin-bottom: 12px; color: #444; display: flex; justify-content: space-between; align-items: center; }
        .input-group { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        .btn-del { background: #fee2e2; color: #dc2626; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .btn-add { background: #1a73e8; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-calc { width: 100%; padding: 16px; background: #059669; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin: 15px 0; }
        .result-box { padding: 20px; background: #1f2937; color: white; border-radius: 12px; display: none; margin-bottom: 25px; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .final-amount { font-size: 1.4em; border-top: 1px solid #4b5563; padding-top: 12px; margin-top: 8px; font-weight: bold; }
        .history-section { border-top: 2px solid #eee; padding-top: 20px; }
        .history-item { font-size: 14px; padding: 12px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; }
        .btn-clear-his { background: none; border: none; color: #9ca3af; font-size: 12px; cursor: pointer; margin-top: 15px; text-decoration: underline; width: 100%; text-align: center; }
        /* Màu sắc động cho lịch sử */
        .txt-pos { color: #059669; font-weight: bold; } /* Màu xanh khi lãi */
        .txt-neg { color: #dc2626; font-weight: bold; } /* Màu đỏ khi lỗ */
    </style>
</head>
<body>

<div class="container">
    <h2>Quản Lý Thu Chi</h2>

    <div class="section">
        <div class="section-title"><span>DOANH THU</span><button class="btn-add" onclick="addField('rev-list')">+ Thêm đơn</button></div>
        <div id="rev-list"><div class="input-group"><input type="number" class="rev-in" placeholder="Số tiền đơn"><button class="btn-del" onclick="this.parentElement.remove()">×</button></div></div>
    </div>

    <div class="section">
        <div class="section-title"><span>CHI PHÍ</span><button class="btn-add" onclick="addField('cost-list')">+ Thêm chi phí</button></div>
        <div id="cost-list"><div class="input-group"><input type="number" class="cost-in" placeholder="Số tiền chi"><button class="btn-del" onclick="this.parentElement.remove()">×</button></div></div>
    </div>

    <div style="padding: 0 10px; margin-bottom: 15px; display: flex; align-items: center;">
        <label style="font-size: 14px; font-weight: bold;">Thuế (%):</label>
        <input type="number" id="taxRate" value="1.5" style="width: 70px; margin-left: 10px; padding: 8px;">
    </div>

    <button class="btn-calc" onclick="calculateAll()">TÍNH & LƯU KẾT QUẢ</button>

    <div id="resultArea" class="result-box">
        <div class="res-row"><span>Tổng doanh thu:</span> <span id="outRev">0</span></div>
        <div class="res-row"><span>Tổng chi phí:</span> <span id="outCost">0</span></div>
        <div class="res-row"><span>Tiền thuế:</span> <span id="outTax" style="color: #f87171;">0</span></div>
        <div class="res-row final-amount"><span>THỰC CẦM:</span> <span id="outFinal">0</span></div>
    </div>

    <div class="history-section">
        <h4 style="margin: 0 0 15px 0;">Lịch sử hôm nay</h4>
        <div id="historyDisplay"></div>
        <button class="btn-clear-his" onclick="clearHistory()">Xóa toàn bộ lịch sử</button>
    </div>
</div>

<script>
    window.onload = showHistory;

    function addField(id) {
        const div = document.createElement('div');
        div.className = 'input-group';
        const cls = id === 'rev-list' ? 'rev-in' : 'cost-in';
        div.innerHTML = `<input type="number" class="${cls}" placeholder="Nhập số tiền"><button class="btn-del" onclick="this.parentElement.remove()">×</button>`;
        document.getElementById(id).appendChild(div);
    }

    function calculateAll() {
        let r = 0; document.querySelectorAll('.rev-in').forEach(i => r += Number(i.value));
        let c = 0; document.querySelectorAll('.cost-in').forEach(i => c += Number(i.value));
        let rate = Number(document.getElementById("taxRate").value);
        let tax = r * (rate / 100);
        let final = r - c - tax;

        const fmt = (n) => n.toLocaleString('vi-VN') + " đ";

        document.getElementById("resultArea").style.display = "block";
        document.getElementById("outRev").innerText = fmt(r);
        document.getElementById("outCost").innerText = fmt(c);
        document.getElementById("outTax").innerText = "-" + fmt(tax);
        
        const finalEl = document.getElementById("outFinal");
        finalEl.innerText = (final > 0 ? "+" : "") + fmt(final);
        finalEl.style.color = final >= 0 ? "#34d399" : "#f87171";

        saveHistory(final);
    }

    function saveHistory(amt) {
        let history = JSON.parse(localStorage.getItem("fixedHistory") || "[]");
        let now = new Date();
        let time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        history.unshift({ time: time, amount: amt });
        if(history.length > 5) history.pop();
        localStorage.setItem("fixedHistory", JSON.stringify(history));
        showHistory();
    }

    function showHistory() {
        let history = JSON.parse(localStorage.getItem("fixedHistory") || "[]");
        const list = document.getElementById("historyDisplay");
        if (history.length === 0) {
            list.innerHTML = "<p style='font-size:13px; color:#9ca3af; text-align:center;'>Trống</p>";
            return;
        }
        list.innerHTML = history.map(h => {
            const isPos = h.amount >= 0;
            const sign = isPos ? "+" : ""; // Số âm sẽ tự có dấu - từ toLocaleString
            const colorClass = isPos ? "txt-pos" : "txt-neg";
            return `
                <div class="history-item">
                    <span style="color: #6b7280;">${h.time}</span>
                    <span class="${colorClass}">${sign}${h.amount.toLocaleString('vi-VN')} đ</span>
                </div>
            `;
        }).join('');
    }

    function clearHistory() {
        if(confirm("Xóa lịch sử?")) {
            localStorage.removeItem("fixedHistory");
            showHistory();
        }
    }
</script>

</body>
</html>
