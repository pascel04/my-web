<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Thu Chi Pro - Thuế 2026</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --bg: #f8fafc;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; color: #1e293b; }
        .container { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
        h2 { text-align: center; color: var(--primary); font-size: 22px; margin-bottom: 24px; font-weight: 800; }
        .section { margin-bottom: 20px; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .section-revenue { background-color: #eff6ff; border-color: #bfdbfe; }
        .section-cost { background-color: #fff7ed; border-color: #ffedd5; }
        .section-title { font-weight: 700; font-size: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
        .btn-del { background: #fff; color: var(--danger); border: 1px solid #fecaca; border-radius: 8px; width: 40px; cursor: pointer; font-size: 18px; }
        .btn-add { background: white; color: var(--primary); border: 1px solid var(--primary); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .btn-calc { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin: 10px 0; }
        .result-box { padding: 20px; background: #0f172a; color: white; border-radius: 16px; display: none; margin-bottom: 24px; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #94a3b8; }
        .final-amount { font-size: 20px; border-top: 1px solid #334155; padding-top: 12px; margin-top: 8px; font-weight: 700; color: white; }
        .history-section { border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .history-item { background: #f1f5f9; margin-bottom: 8px; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .tax-note { font-size: 12px; color: #4ade80; margin-top: 5px; font-style: italic; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sổ Thu Chi Pro</h2>

    <!-- GIỮ NGUYÊN PHẦN DOANH THU -->
    <div class="section section-revenue">
        <div class="section-title" style="color: #1e40af;">
            <span>💰 DOANH THU</span>
            <button class="btn-add" onclick="addField('rev-list')">+ THÊM</button>
        </div>
        <div id="rev-list">
            <div class="input-group">
                <input type="number" class="rev-in" placeholder="Nhập số tiền">
                <button class="btn-del" onclick="this.parentElement.remove()">×</button>
            </div>
        </div>
    </div>

    <!-- GIỮ NGUYÊN PHẦN CHI PHÍ -->
    <div class="section section-cost">
        <div class="section-title" style="color: #9a3412;">
            <span>💸 CHI PHÍ</span>
            <button class="btn-add" onclick="addField('cost-list')">+ THÊM</button>
        </div>
        <div id="cost-list">
            <div class="input-group">
                <input type="number" class="cost-in" placeholder="Nhập số tiền">
                <button class="btn-del" onclick="this.parentElement.remove()">×</button>
            </div>
        </div>
    </div>

    <!-- GIỮ NGUYÊN Ô NHẬP THUẾ LINH HOẠT -->
    <div style="padding: 0 8px 16px 8px; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 14px; font-weight: 600; color: #64748b;">Thuế suất mặc định (%)</span>
        <input type="number" id="taxRate" value="1.5" style="width: 80px; padding: 8px; text-align: center;">
    </div>

    <button class="btn-calc" onclick="calculateAll()">TÍNH & LƯU KẾT QUẢ</button>

    <div id="resultArea" class="result-box">
        <div class="res-row"><span>Doanh thu:</span> <span id="outRev" style="color: white">0</span></div>
        <div class="res-row"><span>Chi phí:</span> <span id="outCost" style="color: white">0</span></div>
        <div class="res-row">
            <span>Thuế (VAT+TNCN):</span> 
            <span id="outTax" style="color: #fb7185;">0</span>
        </div>
        <div id="taxFreeMsg" class="tax-note">✓ Miễn thuế (Doanh thu ≤ 1 tỷ/năm)</div>
        <div class="res-row final-amount"><span>THỰC CẦM:</span> <span id="outFinal">0</span></div>
    </div>

    <div class="history-section">
        <div style="font-weight: 700; margin-bottom: 12px;">Nhật ký thu chi</div>
        <div id="historyDisplay"></div>
        <button onclick="clearHistory()" style="width: 100%; background: none; border: none; color: #94a3b8; font-size: 11px; cursor: pointer; margin-top: 10px;">Xóa lịch sử</button>
    </div>
</div>

<script>
    window.onload = showHistory;

    function addField(id) {
        const div = document.createElement('div');
        div.className = 'input-group';
        const cls = id === 'rev-list' ? 'rev-in' : 'cost-in';
        div.innerHTML = `<input type="number" class="${cls}" placeholder="0"><button class="btn-del" onclick="this.parentElement.remove()">×</button>`;
        document.getElementById(id).appendChild(div);
    }

    function calculateAll() {
        let r = 0; document.querySelectorAll('.rev-in').forEach(i => r += Number(i.value));
        let c = 0; document.querySelectorAll('.cost-in').forEach(i => c += Number(i.value));
        
        // LOGIC THUẾ MỚI 2026: Miễn thuế nếu doanh thu <= 1 tỷ (1.000.000.000)
        let tax = 0;
        let isTaxFree = false;
        
        if (r > 1000000000) {
            let rate = Number(document.getElementById("taxRate").value);
            tax = r * (rate / 100);
            isTaxFree = false;
        } else {
            tax = 0;
            isTaxFree = r > 0; // Chỉ hiện thông báo nếu có nhập doanh thu
        }

        let final = r - c - tax;
        const fmt = (n) => n.toLocaleString('vi-VN') + " đ";

        document.getElementById("resultArea").style.display = "block";
        document.getElementById("outRev").innerText = fmt(r);
        document.getElementById("outCost").innerText = fmt(c);
        document.getElementById("outTax").innerText = "-" + fmt(tax);
        
        // Hiển thị dòng thông báo miễn thuế
        document.getElementById("taxFreeMsg").style.display = isTaxFree ? "block" : "none";
        
        const finalEl = document.getElementById("outFinal");
        finalEl.innerText = (final > 0 ? "+" : "") + fmt(final);
        finalEl.style.color = final >= 0 ? "#4ade80" : "#fb7185";

        saveHistory(final);
    }

    function saveHistory(amt) {
        let history = JSON.parse(localStorage.getItem("tax2026History") || "[]");
        let now = new Date();
        let time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
        history.unshift({ time: time, amount: amt });
        if(history.length > 5) history.pop();
        localStorage.setItem("tax2026History", JSON.stringify(history));
        showHistory();
    }

    function showHistory() {
        let history = JSON.parse(localStorage.getItem("tax2026History") || "[]");
        const list = document.getElementById("historyDisplay");
        list.innerHTML = history.map(h => `
            <div class="history-item">
                <span style="color: #64748b;">${h.time}</span>
                <span style="font-weight:700; color:${h.amount >= 0 ? '#059669' : '#dc2626'}">${h.amount >= 0 ? '+' : ''}${h.amount.toLocaleString('vi-VN')} đ</span>
            </div>
        `).join('') || "<p style='text-align:center; color:#94a3b8; font-size:12px;'>Chưa có dữ liệu</p>";
    }

    function clearHistory() {
        if(confirm("Xóa lịch sử?")) {
            localStorage.removeItem("tax2026History");
            showHistory();
        }
    }
</script>

</body>
</html>
