<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Dòng Tiền Tiểu Thương</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 20px; }
        label { font-weight: 600; font-size: 14px; color: #444; }
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 2; padding: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-clear { flex: 1; background-color: #6c757d; }
        button:hover { opacity: 0.9; }
        .result-box { margin-top: 20px; padding: 15px; background-color: #e8f0fe; border-radius: 8px; border-left: 5px solid #1a73e8; display: none; }
        .history-section { margin-top: 30px; border-top: 2px solid #eee; pt: 20px; }
        .history-item { font-size: 13px; padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .profit { color: #28a745; font-weight: bold; }
        .tax-text { color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h2>Quản Lý Dòng Tiền</h2>

    <label>Doanh thu (VNĐ):</label>
    <input type="number" id="revenue" placeholder="Ví dụ: 5000000">
    
    <label>Chi phí (VNĐ):</label>
    <input type="number" id="cost" placeholder="Ví dụ: 2000000">

    <label>Mức thuế (%):</label>
    <input type="number" id="taxRate" placeholder="Ví dụ: 1.5">

    <div class="btn-group">
        <button onclick="calc()">TÍNH & LƯU</button>
        <button class="btn-clear" onclick="clearAll()">XÓA</button>
    </div>

    <div id="resultArea" class="result-box">
        <p id="kq_tax"></p>
        <p id="kq_final" style="font-size: 1.2em;"></p>
    </div>

    <div class="history-section">
        <h4 style="margin-bottom: 10px;">Lịch sử hôm nay</h4>
        <div id="historyList"></div>
        <button onclick="clearHistory()" style="background: none; color: #dc3545; font-size: 12px; border: none; padding: 5px; cursor: pointer; width: auto; font-weight: normal;">Xóa lịch sử</button>
    </div>
</div>

<script>
    // Hàm hiển thị lịch sử khi vừa mở web
    window.onload = function() {
        showHistory();
    };

    function calc() {
        let r = Number(document.getElementById("revenue").value);
        let c = Number(document.getElementById("cost").value);
        let rate = Number(document.getElementById("taxRate").value);
        
        if(r === 0) return alert("Vui lòng nhập doanh thu!");

        let tax = r * (rate / 100); 
        let finalMoney = r - c - tax;
        const format = (num) => num.toLocaleString('vi-VN');

        // Hiển thị kết quả hiện tại
        document.getElementById("resultArea").style.display = "block";
        document.getElementById("kq_tax").innerHTML = "Thuế: <span class='tax-text'>-" + format(tax) + "</span>";
        document.getElementById("kq_final").innerHTML = "<b>Thực cầm: </b><span class='profit'>" + format(finalMoney) + " VNĐ</span>";

        // LƯU VÀO LỊCH SỬ (LocalStorage)
        saveToHistory(finalMoney);
    }

    function saveToHistory(amount) {
        let history = JSON.parse(localStorage.getItem("moneyHistory") || "[]");
        let time = new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
        history.unshift({ time: time, amount: amount }); // Thêm vào đầu danh sách
        if(history.length > 5) history.pop(); // Chỉ giữ 5 mục gần nhất cho gọn
        localStorage.setItem("moneyHistory", JSON.stringify(history));
        showHistory();
    }

    function showHistory() {
        let history = JSON.parse(localStorage.getItem("moneyHistory") || "[]");
        let html = history.map(item => `
            <div class="history-item">
                <span>${item.time}</span>
                <span class="profit">+${item.amount.toLocaleString('vi-VN')}</span>
            </div>
        `).join('');
        document.getElementById("historyList").innerHTML = html || "<p style='color:#999; font-size:12px;'>Chưa có giao dịch nào</p>";
    }

    function clearAll() {
        document.getElementById("revenue").value = "";
        document.getElementById("cost").value = "";
        document.getElementById("resultArea").style.display = "none";
    }

    function clearHistory() {
        if(confirm("Bạn muốn xóa hết lịch sử tính toán?")) {
            localStorage.removeItem("moneyHistory");
            showHistory();
        }
    }
</script>

</body>
</html>
